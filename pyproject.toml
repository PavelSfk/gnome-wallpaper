[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-app"
version = "0.1.0"
description = "Local wallpaper automation for Ubuntu GNOME"
requires-python = ">=3.12"
dependencies = [
	"requests>=2.31",
]

[project.scripts]
wallpaper-app = "wallpaper_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
